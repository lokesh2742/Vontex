<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#090b12"><meta name="description" content="Vontex — your personal AI workspace">
<link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./icon.svg">
<title>Vontex — Personal AI</title>
<style>
:root{font-family:Inter,system-ui,sans-serif;color:#f2f2fa;background:#090b12;color-scheme:dark;--bg:#090b12;--panel:#121724;--line:#292f40;--muted:#929bb0;--text:#f2f2fa;--accent:#8274ec}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 70% 5%,#37316b44,transparent 42%),var(--bg);color:var(--text)}body.light{--bg:#f4f5fb;--panel:#fff;--line:#dce0ed;--muted:#606b82;--text:#171a27;background:var(--bg);color:var(--text)}.layout{display:flex;min-height:100vh}.side{width:245px;background:var(--panel);border-right:1px solid var(--line);padding:24px 16px;display:flex;flex-direction:column}.brand{font-weight:800;letter-spacing:4px;padding:5px 10px 34px}.mark{display:inline-grid;place-items:center;background:#7669df;border-radius:9px;width:30px;height:30px;margin-right:10px}.new,.nav button,.action{width:100%;padding:12px;border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:9px;text-align:left;margin-bottom:7px;cursor:pointer}.label{font-size:10px;letter-spacing:2px;color:var(--muted);margin:28px 10px 12px}.nav button{border:0;background:transparent;color:var(--muted)}.nav button.active,.nav button:hover{background:#24223d;color:#c2baff}.bottom{margin-top:auto;color:var(--muted);font-size:12px;padding:12px}.main{flex:1;min-width:0;display:flex;flex-direction:column}.top{height:64px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 30px;color:var(--muted);font-size:12px}.ready{border:1px solid #2c3b3c;padding:7px 12px;border-radius:30px;color:#9ed9b9}.ready:before{content:"";display:inline-block;width:6px;height:6px;background:#65d6a1;border-radius:50%;margin-right:8px}.content{width:min(850px,100%);margin:auto;padding:55px 25px}.eyebrow{font-size:10px;letter-spacing:2px;color:#a69aff}.hero{font-size:clamp(40px,7vw,64px);letter-spacing:-3px;line-height:1.05;margin:22px 0 12px}.hero span{background:linear-gradient(90deg,#b1a4ff,#6f9be9);color:transparent;background-clip:text}.sub{color:var(--muted);font-size:14px;line-height:1.7}.chips{display:flex;gap:9px;flex-wrap:wrap;margin:25px 0 38px}.chip{border:1px solid var(--line);border-radius:25px;padding:8px 12px;color:var(--muted);font-size:11px}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.card,.panel{border:1px solid var(--line);border-radius:12px;background:var(--panel);padding:17px}.card{min-height:130px;cursor:pointer;color:var(--text);text-align:left}.card:hover{border-color:#8174e9;transform:translateY(-2px)}.card b{display:block;margin:12px 0 7px;font-size:13px}.card small{color:var(--muted);line-height:1.5}.chat{margin-top:25px;border:1px solid #34394b;border-radius:13px;background:var(--panel);padding:14px}.chat textarea,.field{width:100%;min-height:52px;resize:vertical;border:1px solid var(--line);border-radius:9px;background:transparent;color:var(--text);padding:12px;font:14px inherit;outline:none}.chat textarea{border:0;padding:5px}.chat textarea::placeholder{color:#707990}.chatfoot{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:11px;gap:8px}.send{background:var(--accent);color:white;border:0;border-radius:9px;padding:10px 16px;cursor:pointer}.send:disabled{opacity:.4;cursor:not-allowed}.soft{background:transparent;border:1px solid var(--line);color:var(--text);border-radius:8px;padding:9px 12px;cursor:pointer}.note{text-align:center;color:#788197;font-size:10px;margin-top:12px}.messages{margin:22px 0;display:grid;gap:10px}.msg{padding:13px;background:var(--panel);border:1px solid var(--line);border-radius:10px;font-size:13px;line-height:1.6;white-space:pre-wrap;overflow-wrap:anywhere}.msg.user{border-color:#514a88}.msg .who{font-size:10px;color:#a69aff;letter-spacing:1px;margin-bottom:5px}.foot{padding:17px 30px;border-top:1px solid var(--line);color:#657087;font-size:9px;letter-spacing:1px;display:flex;justify-content:space-between}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.stack{display:grid;gap:12px;margin-top:22px}.item{padding:14px;border:1px solid var(--line);background:var(--panel);border-radius:10px;display:flex;justify-content:space-between;align-items:center;gap:12px}.item small{display:block;color:var(--muted);margin-top:5px}.empty{padding:28px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:12px}.title{font-size:34px;margin:12px 0}.danger{color:#ff9292}.hide{display:none!important}input[type=file]{max-width:100%;color:var(--muted)}.mobileNav{display:none}
@media(max-width:700px){.side{display:none}.top{padding:0 17px;height:57px}.content{padding:40px 17px 90px}.hero{letter-spacing:-2px}.cards{grid-template-columns:1fr}.card{min-height:95px}.chips{margin-bottom:26px}.foot{padding:14px 18px}.foot span:last-child{display:none}.mobileNav{position:fixed;bottom:0;left:0;right:0;display:flex;justify-content:space-around;background:#0d1019ee;border-top:1px solid var(--line);padding:8px 4px calc(8px + env(safe-area-inset-bottom));backdrop-filter:blur(15px);z-index:5}.mobileNav button{border:0;background:transparent;color:#aab1c5;font-size:10px;padding:6px}.mobileNav button span{display:block;font-size:18px;margin-bottom:3px}}
</style>
</head>
<body>
<div class="layout">
<aside class="side"><div class="brand"><span class="mark">✦</span>VONTEX</div><button class="new" onclick="newChat()">＋ &nbsp; New conversation</button><div class="label">PERSONAL SPACE</div><nav class="nav" id="nav"><button class="active" data-page="Workspace" onclick="showPage('Workspace')">▦ &nbsp; Workspace</button><button data-page="Chat history" onclick="showPage('Chat history')">▤ &nbsp; Chat history</button><button data-page="Memory" onclick="showPage('Memory')">✧ &nbsp; Memory</button><button data-page="Files" onclick="showPage('Files')">▱ &nbsp; Files</button></nav><div class="label">TOOLS</div><nav class="nav"><button data-page="Explore" onclick="showPage('Explore')">◎ &nbsp; Explore</button><button data-page="Settings" onclick="showPage('Settings')">⚙ &nbsp; Settings</button></nav><div class="bottom">◉ &nbsp; Personal workspace<br><br>Your conversations stay on this device in this preview.</div></aside>
<main class="main"><header class="top"><span id="crumb">Personal workspace / Workspace</span><span class="ready">Local preview</span></header><section class="content" id="page"></section><footer class="foot"><span>● VONTEX &nbsp; • &nbsp; PERSONAL AI WORKSPACE</span><span>YOUR SPACE, YOUR IDEAS</span></footer></main></div>
<nav class="mobileNav"><button onclick="showPage('Workspace')"><span>▦</span>Home</button><button onclick="showPage('Chat history')"><span>▤</span>History</button><button onclick="showPage('Memory')"><span>✧</span>Memory</button><button onclick="showPage('Settings')"><span>⚙</span>Settings</button></nav>
<script>
const KEY='vontex_v1',inputId='prompt';let state=loadState(),currentId=null,activeFiles=[];
function loadState(){try{return JSON.parse(localStorage.getItem(KEY))||{chats:[],memories:[],files:[],settings:{theme:'dark'}}}catch{return {chats:[],memories:[],files:[],settings:{theme:'dark'}}}}
function save(){localStorage.setItem(KEY,JSON.stringify(state))}
function id(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function showPage(name){document.querySelectorAll('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===name));document.getElementById('crumb').textContent='Personal workspace / '+name;let p=document.getElementById('page');if(name==='Workspace')renderWorkspace();if(name==='Chat history')renderHistory();if(name==='Memory')renderMemory();if(name==='Files')renderFiles();if(name==='Explore')renderExplore();if(name==='Settings')renderSettings()}
function renderWorkspace(){document.getElementById('page').innerHTML='<div class="eyebrow">YOUR PERSONAL AI WORKSPACE</div><h1 class="hero">Think bigger.<br><span>Make it happen.</span></h1><p class="sub">One space for your ideas, questions, files, and everyday work.</p><div class="chips"><span class="chip">✧ On-device memory</span><span class="chip">⌁ Voice input supported</span><span class="chip">▱ Local file workspace</span></div><div class="cards"><button class="card" onclick="usePrompt(\'Explain a difficult idea in simple steps.\')">✧<b>Help me think</b><small>Break down a difficult idea into simple steps.</small></button><button class="card" onclick="showPage(\'Files\')">▤<b>Work with files</b><small>Add documents to your local workspace.</small></button><button class="card" onclick="showPage(\'Explore\')">◎<b>Explore a topic</b><small>Plan research and organise your ideas.</small></button></div><div class="messages" id="messages"></div><div class="chat"><textarea id="prompt" placeholder="Ask Vontex anything..." rows="2"></textarea><div class="chatfoot"><span>Chats save on this device · <button class="soft" onclick="startVoice()">🎙 Voice input</button></span><button class="send" id="send" onclick="sendMessage()" disabled>Send ↑</button></div></div><div class="note">AI engine is not connected yet. Messages are saved locally; Vontex will not invent AI answers.</div>';if(currentId)renderMessages();let inp=document.getElementById('prompt');inp.addEventListener('input',()=>document.getElementById('send').disabled=!inp.value.trim());inp.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendMessage()}})}
function newChat(){currentId=null;showPage('Workspace')}
function usePrompt(t){let i=document.getElementById('prompt');if(!i){showPage('Workspace');i=document.getElementById('prompt')}i.value=t;document.getElementById('send').disabled=false;i.focus()}
async function sendMessage(){let i=document.getElementById('prompt'),t=i?.value.trim();if(!t)return;let c=state.chats.find(x=>x.id===currentId);if(!c){c={id:id(),title:t.slice(0,55),updated:Date.now(),messages:[]};state.chats.unshift(c);currentId=c.id}c.messages.push({role:'user',text:t,time:Date.now()});c.updated=Date.now();save();renderMessages();i.value='';document.getElementById('send').disabled=true;const api=(state.settings.apiUrl||'').trim().replace(/\/$/,'');const key=(state.settings.accessKey||'').trim();if(!api||!key){c.messages.push({role:'model',text:'Your AI connection is not configured yet. Open Settings and add your Cloudflare Worker URL and VONtex access key.',time:Date.now()});save();renderMessages();return}const send=document.getElementById('send');if(send)send.textContent='Thinking…';try{const response=await fetch(api+'/api/chat',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+key},body:JSON.stringify({messages:c.messages.slice(-16).map(m=>({role:m.role==='user'?'user':'model',text:m.text})),memory:state.memories.map(m=>m.text)})});const data=await response.json().catch(()=>({}));if(!response.ok)throw new Error(data.error||'Request failed ('+response.status+').');c.messages.push({role:'model',text:data.reply,time:Date.now()});}catch(error){c.messages.push({role:'model',text:'Connection error: '+(error.message||'Could not contact VONtex API.')+'\\n\\nCheck Settings and make sure your Worker is deployed and configured.',time:Date.now()});}c.updated=Date.now();save();renderMessages();const button=document.getElementById('send');if(button){button.disabled=true;button.textContent='Send ↑'}}
function renderMessages(){let box=document.getElementById('messages');if(!box)return;let c=state.chats.find(x=>x.id===currentId);box.innerHTML='';(c?.messages||[]).forEach(m=>{let el=document.createElement('div');el.className='msg '+(m.role==='user'?'user':'');el.innerHTML='<div class="who">'+(m.role==='user'?'YOU':'VONTEX')+'</div>'+esc(m.text);box.append(el)});if(c)box.scrollIntoView({block:'nearest',behavior:'smooth'})}
function renderHistory(){let rows=state.chats.map(c=>'<div class="item"><div><b>'+esc(c.title)+'</b><small>'+c.messages.length+' messages · '+new Date(c.updated).toLocaleString()+'</small></div><div class="row"><button class="soft" onclick="openChat(\''+c.id+'\')">Open</button><button class="soft danger" onclick="deleteChat(\''+c.id+'\')">Delete</button></div></div>').join('');document.getElementById('page').innerHTML='<div class="eyebrow">YOUR CONVERSATIONS</div><h1 class="title">Chat history</h1><p class="sub">Saved locally on this device.</p><div class="stack">'+(rows||'<div class="empty">No conversations yet. Start a new chat from Workspace.</div>')+'</div>'}
function openChat(x){currentId=x;showPage('Workspace')}
function deleteChat(x){state.chats=state.chats.filter(c=>c.id!==x);if(currentId===x)currentId=null;save();renderHistory()}
function renderMemory(){let rows=state.memories.map(m=>'<div class="item"><div>'+esc(m.text)+'<small>Saved '+new Date(m.time).toLocaleDateString()+'</small></div><button class="soft danger" onclick="deleteMemory(\''+m.id+'\')">Remove</button></div>').join('');document.getElementById('page').innerHTML='<div class="eyebrow">PERSONAL CONTEXT</div><h1 class="title">Memory</h1><p class="sub">Add notes Vontex can use later. These are stored only in this browser for now.</p><div class="panel"><textarea class="field" id="memoryText" placeholder="Example: I prefer explanations with simple examples..." rows="3"></textarea><button class="send" style="margin-top:10px" onclick="addMemory()">Save memory</button></div><div class="stack">'+(rows||'<div class="empty">Your saved notes will appear here.</div>')+'</div>'}
function addMemory(){let t=document.getElementById('memoryText').value.trim();if(!t)return;state.memories.unshift({id:id(),text:t,time:Date.now()});save();renderMemory()}
function deleteMemory(x){state.memories=state.memories.filter(m=>m.id!==x);save();renderMemory()}
function renderFiles(){let rows=state.files.map(f=>'<div class="item"><div>▱ '+esc(f.name)+'<small>'+Math.round(f.size/1024)+' KB · Added '+new Date(f.time).toLocaleDateString()+'</small></div><button class="soft danger" onclick="deleteFile(\''+f.id+'\')">Remove</button></div>').join('');document.getElementById('page').innerHTML='<div class="eyebrow">YOUR DOCUMENTS</div><h1 class="title">Files</h1><p class="sub">Choose text-based files to keep a local record in this browser. Files are not uploaded to an AI service.</p><div class="panel"><input type="file" id="filePick" multiple accept=".txt,.md,.csv,.json,.pdf,.doc,.docx"><p class="note" style="text-align:left">This preview stores file names and sizes only, not document contents.</p><button class="send" onclick="addFiles()">Add selected files</button></div><div class="stack">'+(rows||'<div class="empty">No files added yet.</div>')+'</div>'}
function addFiles(){let files=[...document.getElementById('filePick').files];files.forEach(f=>state.files.unshift({id:id(),name:f.name,size:f.size,time:Date.now()}));save();renderFiles()}
function deleteFile(x){state.files=state.files.filter(f=>f.id!==x);save();renderFiles()}
function renderExplore(){document.getElementById('page').innerHTML='<div class="eyebrow">IDEAS & DISCOVERY</div><h1 class="title">Explore</h1><p class="sub">A starting point for organising your next project.</p><div class="cards"><button class="card" onclick="usePrompt(\'Help me create a step-by-step learning plan for a new subject.\');showPage(\'Workspace\')">✧<b>Learning plan</b><small>Turn a subject into a practical study roadmap.</small></button><button class="card" onclick="usePrompt(\'Help me plan a personal project with milestones.\');showPage(\'Workspace\')">⌘<b>Project planner</b><small>Break a project into milestones and tasks.</small></button><button class="card" onclick="usePrompt(\'Help me brainstorm creative ideas for a project.\');showPage(\'Workspace\')">✦<b>Brainstorm</b><small>Collect and organise possible directions.</small></button></div>'}
function renderSettings(){document.getElementById('page').innerHTML='<div class="eyebrow">PREFERENCES & AI CONNECTION</div><h1 class="title">Settings</h1><div class="stack"><div class="panel"><b>Gemini AI connection</b><p class="sub">Connect your deployed Cloudflare Worker. The Gemini API key stays on the Worker and is never placed in this website.</p><label class="sub" for="apiUrl">Cloudflare Worker URL</label><input class="field" id="apiUrl" placeholder="https://vontex-api.YOUR-SUBDOMAIN.workers.dev" value="'+esc(state.settings.apiUrl||'')+'"><label class="sub" for="accessKey">VONtex access key</label><input class="field" id="accessKey" type="password" autocomplete="off" placeholder="Your VONTEX_ACCESS_KEY" value="'+esc(state.settings.accessKey||'')+'"><div class="row" style="margin-top:12px"><button class="send" onclick="saveAISettings()">Save connection</button><button class="soft" onclick="testAIConnection()">Test connection</button></div><p class="note" id="connectionStatus" style="text-align:left">Your access key is saved in this browser local storage. Do not use this on a shared device.</p></div><div class="item"><div><b>Appearance</b><small>Choose how Vontex looks on this device.</small></div><select class="soft" id="theme" onchange="setTheme(this.value)"><option value="dark">Dark</option><option value="light">Light</option></select></div><div class="item"><div><b>Export your data</b><small>Download chats, memory notes and file list as JSON.</small></div><button class="soft" onclick="exportData()">Export</button></div><div class="item"><div><b>Delete local data</b><small>Remove all Vontex data stored in this browser.</small></div><button class="soft danger" onclick="clearData()">Delete data</button></div><div class="panel"><b>About this build</b><p class="sub">VONtex uses Gemini through a secure Cloudflare Worker. Chat history and memory notes are still stored locally in this browser; cross-device sync will be added in a later stage.</p></div></div>';document.getElementById('theme').value=state.settings.theme}
function saveAISettings(){const api=document.getElementById('apiUrl').value.trim().replace(/\/$/,'');const key=document.getElementById('accessKey').value.trim();if(api&&!/^https:\/\//i.test(api)){alert('Use your HTTPS Cloudflare Worker URL.');return}state.settings.apiUrl=api;state.settings.accessKey=key;save();const status=document.getElementById('connectionStatus');if(status)status.textContent='Connection settings saved in this browser.'}async function testAIConnection(){const api=document.getElementById('apiUrl').value.trim().replace(/\/$/,'');const status=document.getElementById('connectionStatus');if(!api){status.textContent='Enter your Cloudflare Worker URL first.';return}status.textContent='Checking Worker…';try{const r=await fetch(api+'/health');const d=await r.json();if(!r.ok||!d.ok)throw new Error(d.error||'Worker check failed');status.textContent='Worker online · '+d.model+' · '+(d.configured?'secrets configured':'Worker secrets still missing');}catch(e){status.textContent='Could not reach Worker: '+e.message}}function setTheme(v){state.settings.theme=v;document.body.classList.toggle('light',v==='light');save()}
function exportData(){let a=document.createElement('a'),u=URL.createObjectURL(new Blob([JSON.stringify(state,null,2)],{type:'application/json'}));a.href=u;a.download='vontex-data.json';a.click();URL.revokeObjectURL(u)}
function clearData(){if(confirm('Delete all Vontex chats, memory notes, file records and settings from this browser?')){localStorage.removeItem(KEY);state=loadState();currentId=null;showPage('Workspace')}}
function startVoice(){let SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){alert('Voice typing is not supported in this browser. Try Chrome.');return}let r=new SR();r.lang=navigator.language||'en-IN';r.onresult=e=>{let i=document.getElementById('prompt');i.value+=(i.value?' ':'')+e.results[0][0].transcript;document.getElementById('send').disabled=false};r.start()}
document.body.classList.toggle('light',state.settings.theme==='light');showPage('Workspace');if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
</script></body></html>
