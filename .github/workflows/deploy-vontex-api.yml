name: Deploy VONtex API

on:
  push:
    branches:
      - main
    paths:
      - "worker/**"
      - ".github/workflows/deploy-vontex-api.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vontex-api-production
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy Cloudflare Worker
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Wrangler
        run: npm install --global wrangler

      - name: Ensure workers.dev subdomain
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          endpoint="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/subdomain"
          result="$(curl -sS -w "\n%{http_code}" "$endpoint" -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN")"
          status="${result##*
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: wrangler deploy --config worker/wrangler.toml

      - name: Configure Gemini API secret
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          set -euo pipefail
          test -n "$GEMINI_API_KEY"
          printf '%s' "$GEMINI_API_KEY" | wrangler secret put GEMINI_API_KEY --config worker/wrangler.toml

      - name: Configure VONtex access secret
        env:
          VONTEX_ACCESS_KEY: ${{ secrets.VONTEX_ACCESS_KEY }}
        run: |
          set -euo pipefail
          test -n "$VONTEX_ACCESS_KEY"
          printf '%s' "$VONTEX_ACCESS_KEY" | wrangler secret put VONTEX_ACCESS_KEY --config worker/wrangler.toml

\n'}"
          body="${result%
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: wrangler deploy --config worker/wrangler.toml

      - name: Configure Gemini API secret
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          set -euo pipefail
          test -n "$GEMINI_API_KEY"
          printf '%s' "$GEMINI_API_KEY" | wrangler secret put GEMINI_API_KEY --config worker/wrangler.toml

      - name: Configure VONtex access secret
        env:
          VONTEX_ACCESS_KEY: ${{ secrets.VONTEX_ACCESS_KEY }}
        run: |
          set -euo pipefail
          test -n "$VONTEX_ACCESS_KEY"
          printf '%s' "$VONTEX_ACCESS_KEY" | wrangler secret put VONTEX_ACCESS_KEY --config worker/wrangler.toml

\n'*}"
          if [[ "$status" == "200" ]]; then
            existing="$(jq -r '.result.subdomain // empty' <<< "$body")"
            if [[ -n "$existing" ]]; then
              exit 0
            fi
          elif [[ "$status" != "404" ]]; then
            echo "Could not check Cloudflare workers.dev subdomain configuration."
            exit 1
          fi
          created="$(curl -fsS -X PUT "$endpoint" -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "Content-Type: application/json" --data '{"subdomain":"vontex-lokesh2742"}')"
          jq -e '.success == true' <<< "$created" >/dev/null
      - name: Deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: wrangler deploy --config worker/wrangler.toml

      - name: Configure Gemini API secret
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          set -euo pipefail
          test -n "$GEMINI_API_KEY"
          printf '%s' "$GEMINI_API_KEY" | wrangler secret put GEMINI_API_KEY --config worker/wrangler.toml

      - name: Configure VONtex access secret
        env:
          VONTEX_ACCESS_KEY: ${{ secrets.VONTEX_ACCESS_KEY }}
        run: |
          set -euo pipefail
          test -n "$VONTEX_ACCESS_KEY"
          printf '%s' "$VONTEX_ACCESS_KEY" | wrangler secret put VONTEX_ACCESS_KEY --config worker/wrangler.toml

