name: Deploy VONtex API

on:
  push:
    branches:
      - main
    paths:
      - "worker/**"
      - ".github/workflows/deploy-vontex-api.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vontex-api-production
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy Cloudflare Worker
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Wrangler
        run: npm install --global wrangler

      - name: Configure Worker secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          VONTEX_ACCESS_KEY: ${{ secrets.VONTEX_ACCESS_KEY }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$GEMINI_API_KEY"
          test -n "$VONTEX_ACCESS_KEY"
          printf '%s' "$GEMINI_API_KEY" | wrangler secret put GEMINI_API_KEY --config worker/wrangler.toml
          printf '%s' "$VONTEX_ACCESS_KEY" | wrangler secret put VONTEX_ACCESS_KEY --config worker/wrangler.toml

      - name: Deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: wrangler deploy --config worker/wrangler.toml
